<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIATI — Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ── Thème sombre (défaut) ── */
    :root {
      --orange: #f97316;
      --orange-dark: #ea580c;
      --bg: #080b12;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.07);
      --input-bg: rgba(255, 255, 255, 0.04);
      --input-border: rgba(255, 255, 255, 0.1);
      --text: #f0f0f0;
      --muted: #6b7280;
      --hint-bg: rgba(255, 255, 255, 0.02);
      --hint-border: rgba(255, 255, 255, 0.05);
      --orb-opacity: 0.18;
    }

    /* ── Thème clair ── */
    :root[data-theme='light'] {
      --bg: #f1f5f9;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(0, 0, 0, 0.08);
      --input-bg: rgba(0, 0, 0, 0.03);
      --input-border: rgba(0, 0, 0, 0.12);
      --text: #0f172a;
      --muted: #64748b;
      --hint-bg: rgba(0, 0, 0, 0.02);
      --hint-border: rgba(0, 0, 0, 0.06);
      --orb-opacity: 0.08;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ── Animated background ── */
    .bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.18;
      animation: drift 14s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, #f97316, #b45309);
      top: -180px;
      left: -160px;
      animation-duration: 16s;
    }

    .orb-2 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, #7c3aed, #1d4ed8);
      bottom: -160px;
      right: -120px;
      animation-duration: 20s;
      animation-delay: -6s;
    }

    .orb-3 {
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, #06b6d4, #0284c7);
      top: 55%;
      left: 60%;
      animation-duration: 12s;
      animation-delay: -3s;
      opacity: 0.1;
    }

    @keyframes drift {
      0% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(40px, 30px) scale(1.05);
      }

      100% {
        transform: translate(-30px, 50px) scale(0.95);
      }
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* ── Card ── */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      margin: 20px;
      padding: 44px 40px 40px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.03) inset, 0 32px 80px rgba(0, 0, 0, 0.5), 0 0 60px rgba(249, 115, 22, 0.04);
      animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 36px;
    }

    .logo-img {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      margin-bottom: 16px;
    }

    @keyframes pulse-badge {

      0%,
      100% {
        box-shadow: 0 8px 24px rgba(249, 115, 22, 0.35);
      }

      50% {
        box-shadow: 0 8px 36px rgba(249, 115, 22, 0.55);
      }
    }

    .logo-badge svg {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: #fff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text);
      margin-bottom: 4px;
    }

    .header p {
      font-size: 13px;
      color: var(--muted);
    }

    /* ── Form ── */
    .form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .input-group label {
      font-size: 11px;
      font-weight: 600;
      color: #9ca3af;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap .field-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      stroke: var(--muted);
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
      transition: stroke 0.2s;
      z-index: 1;
    }

    .input-wrap input {
      width: 100%;
      padding: 12px 40px 12px 40px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }

    .input-wrap input::placeholder {
      color: #374151;
    }

    .input-wrap input:focus {
      border-color: var(--orange);
      background: rgba(249, 115, 22, 0.04);
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1);
    }

    .input-wrap:focus-within .field-icon {
      stroke: var(--orange);
    }

    .toggle-pwd {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: var(--muted);
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }

    .toggle-pwd:hover {
      color: var(--orange);
    }

    .toggle-pwd svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── Error ── */
    .error {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 11px 14px;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 8px;
      color: #f87171;
      font-size: 13px;
    }

    .error.visible {
      display: flex;
      animation: shake 0.35s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }

    @keyframes shake {

      10%,
      90% {
        transform: translateX(-2px);
      }

      20%,
      80% {
        transform: translateX(4px);
      }

      30%,
      50%,
      70% {
        transform: translateX(-4px);
      }

      40%,
      60% {
        transform: translateX(4px);
      }
    }

    .error svg {
      flex-shrink: 0;
      width: 15px;
      height: 15px;
      stroke: #f87171;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── Button ── */
    .btn {
      position: relative;
      margin-top: 6px;
      padding: 13px;
      background: linear-gradient(135deg, #f97316, #ea580c);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      letter-spacing: 0.3px;
      cursor: pointer;
      overflow: hidden;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(249, 115, 22, 0.3);
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .btn:hover:not(:disabled)::before {
      opacity: 1;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 28px rgba(249, 115, 22, 0.4);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .btn-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .spinner {
      display: none;
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .btn.loading .spinner {
      display: block;
    }

    /* ── Theme toggle ── */
    #theme-toggle-login {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 100;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(12px);
      transition: all 0.2s;
    }

    #theme-toggle-login:hover {
      border-color: var(--orange);
      color: var(--orange);
      transform: scale(1.08);
    }

    #theme-toggle-login svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hint {
      margin-top: 22px;
      padding: 12px 14px;
      background: var(--hint-bg);
      border: 1px solid var(--hint-border);
      border-radius: 8px;
      font-size: 12px;
      color: #4b5563;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hint svg {
      flex-shrink: 0;
      width: 13px;
      height: 13px;
      stroke: #6b7280;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hint code {
      color: #f97316;
      background: rgba(249, 115, 22, 0.08);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 11px;
    }
  </style>
</head>

  <script>
    // ── THEME ──
    (function () {
      const saved = localStorage.getItem('siati_theme') || 'dark';
      if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
      document.addEventListener('DOMContentLoaded', () => {
        const s = document.getElementById('icon-sun-l');
        const m = document.getElementById('icon-moon-l');
        if (saved === 'light') { s.style.display = 'block'; m.style.display = 'none'; }
      });
    })();

    function toggleTheme() {
      const root = document.documentElement;
      const isLight = root.getAttribute('data-theme') === 'light';
      const next = isLight ? 'dark' : 'light';
      if (next === 'light') root.setAttribute('data-theme', 'light');
      else root.removeAttribute('data-theme');
      localStorage.setItem('siati_theme', next);
      const s = document.getElementById('icon-sun-l');
      const m = document.getElementById('icon-moon-l');
      s.style.display = next === 'light' ? 'block' : 'none';
      m.style.display = next === 'light' ? 'none' : 'block';
    }

    /* ── Toggle password visibility ── */
    const toggleBtn = document.getElementById('toggle-pwd');
    const pwdInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eye-icon');
    const eyeOpen = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    const eyeClosed = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`;

    toggleBtn.addEventListener('click', () => {
      const hidden = pwdInput.type === 'password';
      pwdInput.type = hidden ? 'text' : 'password';
      eyeIcon.innerHTML = hidden ? eyeClosed : eyeOpen;
    });

    const existing = localStorage.getItem('siati_token');
    if (existing) {
      fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + existing } })
        .then(r => { if (r.ok) window.location.href = '/'; })
        .catch(() => { });
    }

    /* ── Login handler ── */
    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btn');
      const btnText = document.getElementById('btn-text');
      const error = document.getElementById('error');
      const errText = document.getElementById('error-text');

      btn.disabled = true;
      btn.classList.add('loading');
      btnText.textContent = 'Connexion…';
      error.classList.remove('visible');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (res.ok) {
          const data = await res.json();
          localStorage.setItem('siati_token', data.access_token);
          document.cookie = `siati_token=${data.access_token}; path=/; SameSite=Lax`;
          btnText.textContent = 'Connexion réussie…';
          window.location.href = '/';
        } else {
          const body = await res.json().catch(() => ({}));
          errText.textContent = body.detail || 'Identifiant ou mot de passe incorrect.';
          error.classList.remove('visible');
          void error.offsetWidth;
          error.classList.add('visible');
        }
      } catch {
        errText.textContent = 'Impossible de joindre le serveur.';
        error.classList.remove('visible');
        void error.offsetWidth;
        error.classList.add('visible');
      } finally {
        btn.disabled = false;
        btn.classList.remove('loading');
        btnText.textContent = 'Se connecter';
      }
    }

    // Load custom logo if present
    (async function () {
      try {
        const resp = await fetch('/api/branding/logo?t=' + Date.now(), { method: 'HEAD' });
        if (resp.ok) {
          const src = '/api/branding/logo?t=' + Date.now();
          document.getElementById('login-logo-img').src = src;
        }
      } catch (_) { /* no custom logo */ }
    })();

    document.getElementById('username').focus();
  </script>
</body>

</html>
