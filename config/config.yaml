# === config.yaml ===
# Paramètres de compatibilité pour les commandes CLI legacy (playbook-v2, index-rag-v2).
#
# NOTE : La configuration principale de l'application (API web, ML, Ollama)
# est gérée par les variables d'environnement via app/core/settings.py.
# Copiez .env.example → .env pour les surcharger.
# Ce fichier ne concerne que la voie V2 CLI (app/module_llm/).

database:
  path: "data/pentest.db"
  top_n_vulns: 10

rag:
  knowledge_dir: "data/knowledge_base"
  output_dir: "data/faiss_index"
  index_path: "data/faiss_index/pentest.index"
  chunks_path: "data/faiss_index/chunks.json"
  embedding_model: "all-MiniLM-L6-v2"
  chunk_size: 500
  chunk_overlap: 50
  top_k: 5

llm:
  ollama_url: "http://localhost:11434"
  model: "llama3"
  timeout_seconds: 120
  max_tokens: 2048
  temperature: 0.1

logging:
  level: "INFO"
  file: "logs/llm_module.log"
