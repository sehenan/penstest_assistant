# ==============================================================================
# SIATI — Orchestration Docker Compose
#   - siati        : application FastAPI (UI + API)
#   - ollama       : serveur LLM local
#   - ollama-init  : tâche unique qui télécharge le modèle (1er démarrage)
#   - redis        : cache / rate-limiting (optionnel, fallback mémoire)
#
# Démarrage :  docker compose up -d --build
# (Le 1er lancement télécharge le modèle Ollama ~4 Go : patienter.)
# ==============================================================================

services:
  # ---------------------------------------------------------------------------
  # Application principale SIATI
  # ---------------------------------------------------------------------------
  siati:
    build:
      context: .
      dockerfile: Dockerfile
    image: siati:latest
    container_name: siati-app
    ports:
      - "8505:8505"
    environment:
      SIATI_HOST: 0.0.0.0
      SIATI_PORT: "8505"
      PENTEST_DB_URL: sqlite:////app/data/pentest.db
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: llama3
      OLLAMA_TIMEOUT: "1800"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      # Données persistantes (BDD SQLite, FAISS, intel, modèle ML, base de connaissance)
      - ./data:/app/data
      - ./logs:/app/logs
      # Surcharge de configuration sans rebuild (paramètres RAG, etc.)
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - siati-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8505/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Serveur LLM Ollama
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: siati-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    networks:
      - siati-network
    healthcheck:
      # L'image ollama ne contient pas curl ; on utilise la CLI intégrée.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Initialisation : télécharge le modèle puis s'arrête.
  # ---------------------------------------------------------------------------
  ollama-init:
    image: ollama/ollama:latest
    container_name: siati-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull llama3"]
    restart: "no"
    networks:
      - siati-network

  # ---------------------------------------------------------------------------
  # Cache Redis (rate-limiting + cache applicatif)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: siati-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - siati-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  ollama-data:
    driver: local
  redis-data:
    driver: local

networks:
  siati-network:
    driver: bridge
